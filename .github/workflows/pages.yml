name: pages

# Publishes the home page (web/), llms.txt and examples/demo to GitHub Pages: the built package next to the page, no bundler.
on:
  push:
    branches: [main]
    paths: ['examples/**', 'src/**', 'web/**', 'llms.txt', 'llms-full.txt', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Same layout as the repository, so the page's ../../dist/ import works unchanged.
      - name: assemble site
        run: |
          mkdir -p site/examples
          cp -r dist site/dist
          cp -r examples/demo site/examples/demo
          cp web/* llms.txt llms-full.txt site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
