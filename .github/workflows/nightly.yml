name: nightly

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Bench budgets (desktop) are multiplied by this. 2: the shared GitHub VM is slower than the desktop the budgets
  # were set for, so a pass means within the slowest-target budget. Ratio gates are not relaxed: both sides share the machine.
  CI_FACTOR: 2

# Jobs run on GitHub-hosted Ubuntu (see ci.yml); a job is capped at 6 hours.
jobs:
  # (a), (d): bench at 100 MB per engine, judged with the CI factor; gate table to the job summary, JSON to an artifact.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run bench:build
      - run: node bench/run.mjs ${{ matrix.browser }} --parts gates100,extras,year --runs 10
      - name: gate table
        if: ${{ !cancelled() }}
        run: node bench/gates.ts --factor "$CI_FACTOR" --require gates100,extras,year bench/results/${{ matrix.browser }}.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bench-${{ matrix.browser }}
          path: bench/results/${{ matrix.browser }}.json
          if-no-files-found: warn

  # (b): long suites (CIPHER_LONG=1) in Node and each browser, with the 30-minute soak.
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        project: [node, chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: matrix.project != 'node'
        run: npx playwright install --with-deps ${{ matrix.project }}
      - run: npx vitest run --project ${{ matrix.project }}
        env:
          CIPHER_LONG: '1'

  # (c): long suites against the newest PGlite as an upgrade early warning; allowed to fail. Node and Chromium only.
  latest-pglite:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        project: [node, chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # pgvector is built for one exact PGlite: install the version peered to the newest PGlite; fails (allowed) if none yet.
      - name: newest PGlite and the pgvector built for it
        run: |
          pglite=$(npm view @electric-sql/pglite@latest version)
          pgvector=$(curl -fsS https://registry.npmjs.org/@electric-sql%2fpglite-pgvector | node -e '
            const doc = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const match = Object.values(doc.versions).filter((v) => v.peerDependencies?.["@electric-sql/pglite"] === process.argv[1]);
            if (match.length === 0) { console.error(`no pglite-pgvector for @electric-sql/pglite ${process.argv[1]}`); process.exit(1); }
            console.log(match.at(-1).version);
          ' "$pglite")
          npm install --no-save "@electric-sql/pglite@$pglite" "@electric-sql/pglite-pgvector@$pgvector"
      - run: npm ls @electric-sql/pglite @electric-sql/pglite-pgvector || true
      - if: matrix.project != 'node'
        run: npx playwright install --with-deps ${{ matrix.project }}
      - run: npx vitest run --project ${{ matrix.project }}
        env:
          CIPHER_LONG: '1'
