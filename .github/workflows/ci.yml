name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'bench/results/**'
      - '.github/workflows/publish.yml'
      - '.github/workflows/nightly.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'bench/results/**'
      - '.github/workflows/publish.yml'
      - '.github/workflows/nightly.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Main runs finish; superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# All jobs run on GitHub-hosted Ubuntu (16 GB); browsers come from `playwright install --with-deps`.
jobs:
  # The browser and compat jobs (the slow part) run only when something they exercise changed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.diff.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo browser=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(src/|test/|package(-lock)?\.json$|vitest\.config\.ts$|tsconfig[^/]*\.json$|scripts/test-browser\.mjs$|\.github/workflows/ci\.yml$)'; then
            echo browser=true >> "$GITHUB_OUTPUT"
          else
            echo browser=false >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  test-browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Firefox peaks near 3x Chromium's memory per file (14.3 GB at 4 files, 8.5 GB at 1): one file at a time fits.
      - run: npm run test:browser -- --project ${{ matrix.browser }} ${{ matrix.browser == 'firefox' && '--maxWorkers=1' || '' }}

  # Compat lock (test/fs/compat.test.ts): WebKit and Chromium each write a store, every engine opens both.
  compat-write:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx vitest run --project ${{ matrix.browser }} test/fs/compat.test.ts
        env:
          CIPHER_COMPAT_WRITE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.browser }}
          path: test-results/compat/${{ matrix.browser }}.bin
          if-no-files-found: error
          retention-days: 3

  compat-read:
    needs: compat-write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [node, chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: compat-*
          merge-multiple: true
          path: test-results/compat
      - if: matrix.project != 'node'
        run: npx playwright install --with-deps ${{ matrix.project }}
      - run: npx vitest run --project ${{ matrix.project }} test/fs/compat.test.ts
        env:
          CIPHER_COMPAT_READ: webkit,chromium
