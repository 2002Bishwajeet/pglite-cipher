name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Main runs finish (a newer push only replaces a waiting one); superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Jobs run on whichever of the owner's self-hosted runners labelled `pc-ci` is free: the yantra-box
# mini PC (Debian 13), the Mac (macOS, native WebKit) and the G14 laptop (only while it has spare
# memory; its jobs hold the machine's heavy lock). Playwright system dependencies are installed once
# per machine and browsers stay in ~/.cache/ms-playwright (macOS: ~/Library/Caches/ms-playwright),
# so `playwright install` is a no-op after the first run: no apt-get, no --with-deps.
# WebKit jobs stay on yantra-box: Playwright's WebKit is unsupported on the G14 (Arch) and its
# browser connection closed mid-run on the Mac (2026-11-13), so it is only proven on the box.
# The other browser jobs use `pc-ci-heavy` (yantra-box and the Mac): systemd-oomd killed the G14
# runner during the Firefox suite (#67), so the G14 takes only lint, build and the Node tests.
# The repo is private; when it goes public, switch to GitHub-hosted runners.
jobs:
  lint:
    runs-on: [self-hosted, pc-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  build:
    runs-on: [self-hosted, pc-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    runs-on: [self-hosted, pc-ci]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run harness:test

  test-browser:
    runs-on: ${{ matrix.browser == 'webkit' && fromJSON('["self-hosted", "yantra-box"]') || fromJSON('["self-hosted", "pc-ci-heavy"]') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install ${{ matrix.browser }}
      # Firefox keeps about three times the memory of Chromium for the same file (open.test.ts alone:
      # 8.7 GB against 2.5 GB, measured on yantra-box 2026-11-17), and the runner unit is capped at
      # 10 GB. Peak resident memory of the suite, summed over the process tree: 14.3 GB at the default
      # 4 files at a time (OOM-killed or throttled into timeouts in CI), 13.6 GB at 2, 8.5 GB at 1
      # (535 s). It does not grow across files: it falls back to 3-4 GB between them, so this is a
      # per-file peak, not a leak. One file at a time is the only setting under the cap.
      - run: npm run test:browser -- --project ${{ matrix.browser }} ${{ matrix.browser == 'firefox' && '--maxWorkers=1' || '' }}

  # The compatibility lock (test/fs/compat.test.ts): WebKit and Chromium each write a store, and
  # every engine opens both. Two engines that each read only their own stores is what this catches.
  compat-write:
    runs-on: ${{ matrix.browser == 'webkit' && fromJSON('["self-hosted", "yantra-box"]') || fromJSON('["self-hosted", "pc-ci-heavy"]') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install ${{ matrix.browser }}
      - run: npx vitest run --project ${{ matrix.browser }} test/fs/compat.test.ts
        env:
          CIPHER_COMPAT_WRITE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.browser }}
          path: test-results/compat/${{ matrix.browser }}.bin
          if-no-files-found: error
          retention-days: 3

  compat-read:
    needs: compat-write
    runs-on: ${{ matrix.project == 'webkit' && fromJSON('["self-hosted", "yantra-box"]') || fromJSON('["self-hosted", "pc-ci-heavy"]') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [node, chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: compat-*
          merge-multiple: true
          path: test-results/compat
      - if: matrix.project != 'node'
        run: npx playwright install ${{ matrix.project }}
      - run: npx vitest run --project ${{ matrix.project }} test/fs/compat.test.ts
        env:
          CIPHER_COMPAT_READ: webkit,chromium
