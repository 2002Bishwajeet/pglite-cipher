<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pglite-cipher spike bench</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; max-width: 900px; }
      fieldset { margin-bottom: 12px; }
      pre { background: #f4f4f4; padding: 8px; overflow: auto; max-height: 60vh; white-space: pre-wrap; word-break: break-all; }
      #status { font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <h1>pglite-cipher spike bench (issue #2)</h1>
    <p>Throwaway. Builds a database with plain <code>idb://</code> and with the prototype at 8, 32 and 64 KB, and times the gates of the plan (03-spike-prototype-benchmarks.md).</p>
    <fieldset>
      <legend>Run</legend>
      <label><input type="checkbox" name="part" value="gates10" checked /> gates, 10 MB</label>
      <label><input type="checkbox" name="part" value="gates100" /> gates, 100 MB</label>
      <label><input type="checkbox" name="part" value="extras" checked /> G6, G8 deriveKey, AES-GCM micro</label>
      <label><input type="checkbox" name="part" value="year" /> G8 simulated year (365 sessions)</label>
      <label><input type="checkbox" name="part" value="g7" checked /> G7 (Tauri only)</label>
      <br />
      <label>Runs per measurement <input id="runs" type="number" value="20" min="1" max="100" /></label>
      <button id="run">Run</button>
      <button id="copy">Copy results</button>
    </fieldset>
    <div id="status">idle</div>
    <pre id="out"></pre>
    <script type="module" src="./bench.ts"></script>
  </body>
</html>
