<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pglite-cipher bench</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #1a1a1a; --muted: #f4f4f4; --border: #c8c8c8; }
      @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #ececec; --muted: #262626; --border: #4a4a4a; } }
      body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; max-width: 900px; background: var(--bg); color: var(--fg); }
      fieldset { margin-bottom: 12px; border: 1px solid var(--border); }
      pre { background: var(--muted); color: var(--fg); padding: 8px; overflow: auto; max-height: 60vh; white-space: pre-wrap; word-break: break-all; }
      #status { font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <h1>pglite-cipher bench</h1>
    <p>Builds a database with plain <code>idb://</code> and with <code>EncryptedFs</code> over IndexedDB (64 KB blocks), and times the gates G1 to G9 and the key operations (see <code>bench/README.md</code>).</p>
    <fieldset>
      <legend>Run</legend>
      <label><input type="checkbox" name="part" value="gates10" checked /> gates, 10 MB</label>
      <label><input type="checkbox" name="part" value="gates100" /> gates, 100 MB</label>
      <label><input type="checkbox" name="part" value="enc10" /> encrypted only, 10 MB (no plain build)</label>
      <label><input type="checkbox" name="part" value="enc100" /> encrypted only, 100 MB (no plain build)</label>
      <label><input type="checkbox" name="part" value="levers10" /> memory levers, 10 MB (#48)</label>
      <label><input type="checkbox" name="part" value="levers100" /> memory levers, 100 MB (#48)</label>
      <label><input type="checkbox" name="part" value="extras" checked /> G6, G8 deriveKey, AES-GCM micro, crypto overhead</label>
      <label><input type="checkbox" name="part" value="year" /> G8 simulated year (365 sessions)</label>
      <label><input type="checkbox" name="part" value="ops" /> startup and operations, plain and encrypted</label>
      <label><input type="checkbox" name="part" value="opfsread" /> spike #82: OPFS read, 300 MB of 65580 B records, three layouts</label>
      <br />
      <label>Runs per measurement <input id="runs" type="number" value="20" min="1" max="100" /></label>
      <button id="run">Run</button>
      <button id="copy">Copy results</button>
    </fieldset>
    <div id="status">idle</div>
    <pre id="out"></pre>
    <script type="module" src="./bench.ts"></script>
  </body>
</html>
